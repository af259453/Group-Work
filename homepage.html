<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="ecomm.css">

<body>

<header>
  <h1>CUU-eShop</h1>
  <nav>
    <a href="homepage.html">Home</a>
    <a href="about.html">About</a>

  </nav>
</header>

<section class="hero">
  <h1>Your Trusted Electronics Store for CUU Students</h1>
  <p>Affordable, original gadgets delivered to your hostel or home.</p>

  <aside class="login-card" aria-label="Login card">
  <h3>Login</h3>

  <form class="login-form" action="#" method="post">

    <label for="username">Username</label>
    <div class="input-wrap">
      <i class="fa fa-user input-icon" aria-hidden="true"></i>
      <input id="username" name="username" type="text" placeholder="Enter username" required>
    </div>

    <label for="password">Password</label>
    <div class="input-wrap">
      <i class="fa fa-lock input-icon" aria-hidden="true"></i>
      <input id="password" name="password" type="password" placeholder="Enter password" required>
    </div>

    <div class="form-row">
      <label class="checkbox-label">
        <input type="checkbox" name="remember"> Remember me
      </label>
      <a class="forgot-link" href="#">Forgot?</a>
    </div>

    <div class="btn-row">
      <button class="btn primary" type="submit">Login</button>
      <a class="btn secondary" href="team.html">Meet Our Team</a>
    </div>
  </form>
</aside>

<h2 style="text-align:center; color:#ffffff;">Featured Products</h2>
<section class="container products">
  <div class="card">
    <img src="image/laptops.jpg">
    <h3>Laptops</h3>
  </div>
  <div class="card">
    <img src="image/smartphones.jpg">
    <h3>Smartphones</h3>
  </div>
  <div class="card">
    <img src="image/tablets.jpg">
    <h3>Tablets</h3>
  </div>
  <div class="card">
    <img src="image/accessories.jpg">
    <h3>Accessories</h3>
  </div>
</section>

<footer>

  <div class="social-icons">
    <span><i class="fa-brands fa-facebook"></i></span>
    <span><i class="fa-brands fa-x-twitter"></i></span>
    <span><i class="fa-brands fa-instagram"></i></span>
    <span><i class="fa-brands fa-linkedin-in"></i></span>
  </div>

  <p>© 2025 | CUU-eShop Group 22</p>
</footer>

</html>
